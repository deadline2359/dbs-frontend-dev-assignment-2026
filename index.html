<!doctype html>
<html lang="en" data-theme="light" data-segment="retail">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6fa" />
    <title>Meridian Banking</title>
    <script>
      (() => {
        const root = document.documentElement;
        const defaultTheme = window.matchMedia("(prefers-color-scheme: dark)")
          .matches
          ? "dark"
          : "light";
        const savedTheme = localStorage.getItem("meridian-theme");
        const savedSegment = localStorage.getItem("meridian-segment");
        const theme =
          savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : defaultTheme;
        const segment =
          savedSegment === "retail" || savedSegment === "premium"
            ? savedSegment
            : "retail";

        root.dataset.theme = theme;
        root.dataset.segment = segment;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
